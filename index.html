<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>思い出コルクボード</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; background: #f4f4f4; }
        .card { background: #fff; padding: 15px; margin-bottom: 15px; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <h1>思い出コルクボード</h1>
    <div id="posts">読み込み中...</div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabase = window.supabase.createClient(
            'https://sagrjbgmyghmswnavcip.supabase.co',
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNhZ3JqJbgmyghmswnavcipIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTc2OTcwNTF9.Wn3fS6M3y7q5M7N7q5M7N7q5M7N7q5M7N7q5M7N7q5M'
        );

        async function load() {
            const { data, error } = await supabase.from('posts').select('*');
            const div = document.getElementById('posts');
            if (error) {
                div.innerHTML = 'エラー: ' + error.message;
                return;
            }
            if (data.length === 0) {
                div.innerHTML = 'まだ投稿がありません。';
                return;
            }
            div.innerHTML = data.map(p => `
                <div class="card">
                    <h3>${p.title}</h3>
                    <p>${p.content}</p>
                    <small>投稿者: ${p.author}</small>
                </div>
            `).join('');
        }
        load();
    </script>
</body>
</html>
