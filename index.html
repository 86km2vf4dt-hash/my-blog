<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NG Log - コルクボード風ブログ</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
            /* コルクボードの背景画像設定 */
            background-color: #f5f2eb;
            background-image: url('images/CorkBoard02.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #333;
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
        }

        header h1 { margin: 0 0 5px 0; }
        header p { margin: 0; color: #666; }

        /* 投稿フォーム（付箋・カード風） */
        .post-form {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            margin-bottom: 30px;
        }

        .post-form h3 { margin-top: 0; color: #444; }

        .post-form label {
            display: block;
            margin-bottom: 12px;
            font-size: 0.9rem;
            font-weight: bold;
            color: #555;
        }

        .post-form input, .post-form textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
        }

        .post-form button {
            background-color: #d97706;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }

        .post-form button:hover { background-color: #b45309; }

        /* 記事カード（付箋・ピン留め風） */
        .article-card {
            background: #fff9db; /* 付箋風の黄色っぽい背景 */
            padding: 20px;
            border-radius: 4px;
            box-shadow: 3px 3px 10px rgba(0,0,0,0.2);
            margin-bottom: 20px;
            position: relative;
            transform: rotate(-0.5deg); /* 少し傾けて手書き風に */
            transition: transform 0.2s;
        }

        .article-card:nth-child(even) {
            transform: rotate(0.5deg);
            background: #e6fcf5; /* 交互に色を変えると可愛い */
        }

        .article-card:hover {
            transform: scale(1.01) rotate(0deg);
        }

        .article-card .date { font-size: 0.8rem; color: #666; }
        .article-card .author { font-size: 0.85rem; color: #0ca678; font-weight: bold; margin-bottom: 5px; }
        .article-card h2 { margin: 5px 0 10px 0; font-size: 1.3rem; color: #222; }
        .article-card p { line-height: 1.6; color: #444; word-break: break-all; }

        footer {
            text-align: center;
            font-size: 0.8rem;
            color: #fff;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>思い出コルクボード</h1>
            <p>思い出や日常なんでも書いてね</p>
        </header>

        <!-- 投稿フォーム -->
        <div class="post-form">
            <h3>お友達と一緒に投稿する</h3>
            <form id="blog-form">
                <label>お名前：<input type="text" id="name" required placeholder="例：お友達の名前"></label>
                <label>タイトル：<input type="text" id="title" required placeholder="例：今日の出来事"></label>
                <label>本文：<textarea id="content" rows="4" required placeholder="本文を入力..."></textarea></label>
                <button type="submit">投稿する</button>
            </form>
        </div>

        <!-- 記事一覧が表示される場所 -->
        <div id="posts-container"></div>

        <footer>
            <p>© 2026 My Simple Blog</p>
        </footer>
    </div>

    <!-- Supabase SDKの読み込み -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://sagrjbgmyghmswnavcip.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_PjC4sz4d9W6ELmITEKJ05g_0Er-EaCM';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const form = document.getElementById('blog-form');
        const container = document.getElementById('posts-container');

        async function fetchPosts() {
            const { data, error } = await supabaseClient
                .from('posts')
                .select('*')
                .order('created_at', { ascending: false });

            let dynamicHtml = '';
            
            if (!error && data) {
                data.forEach(post => {
                    const dateStr = new Date(post.created_at).toLocaleDateString();
                    dynamicHtml += `
                        <div class="article-card">
                            <div class="date">${dateStr}</div>
                            <div class="author">投稿者: ${escapeHtml(post.name)}</div>
                            <h2>${escapeHtml(post.title)}</h2>
                            <p>${escapeHtml(post.content).replace(/\n/g, '<br>')}</p>
                        </div>
                    `;
                });
            }

            // 大切な固定記事（消えないようにここにセット）
            const fixedContent = `
                <div class="article-card">
                    <div class="date">2026.11.15</div>
                    <div class="author">投稿者: 管理人</div>
                    <h2>ブログを編集しました！</h2>
                    <p>今までAIの言われるがままに作成してきましたが、ついに自分でも作成することに成功しました。やったね!ここから私の日常を記載していこうと思います。</p>
                </div>
            `;
            
            container.innerHTML = dynamicHtml + fixedContent;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('name').value;
            const title = document.getElementById('title').value;
            const content = document.getElementById('content').value;

            const { error } = await supabaseClient
                .from('posts')
                .insert([{ name, title, content }]);

            if (error) {
                alert('投稿した内容の保存に失敗しました: ' + error.message);
            } else {
                alert('投稿が完了しました！');
                form.reset();
                fetchPosts();
            }
        });

        function escapeHtml(str) {
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        fetchPosts();
    </script>
</body>
</html>
